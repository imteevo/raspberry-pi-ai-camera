# Runtime configuration. CLI flags override these values.
backend: imx500          # imx500 | hailo
preview: false           # show a Picamera2 preview window (requires a desktop/display)
max_frames: 0            # 0 = run until Ctrl+C

detection:
  threshold: 0.55        # minimum confidence score
  max_detections: 10
  labels_file: null      # optional path to a newline-separated labels file

imx500:
  model: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  # Overrides for models without embedded intrinsics (leave null for defaults)
  bbox_normalization: null
  bbox_order: null       # "yx" (default) or "xy"
  inference_rate: null   # frames per second

hailo:
  # Installed by hailo-all (hailo-models). Use the *_h8.hef variants for Hailo-8 (26 TOPS).
  model: /usr/share/hailo-models/yolov8s_h8l.hef
  camera_num: 0
  main_size: [1280, 960]
